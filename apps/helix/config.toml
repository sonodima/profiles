theme = "everforest_dark"

[editor]
line-number = "relative"
true-color = true
auto-format = true
completion-replace = true
rulers = [80]
bufferline = "multiple"
color-modes = true
default-line-ending = "lf"

[editor.cursor-shape]
insert = "bar"

[editor.lsp]
display-messages = true
display-inlay-hints	= true
