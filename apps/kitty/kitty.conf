#######################
# Tab Bar
#######################

tab_bar_min_tabs 1
tab_bar_edge bottom
tab_bar_margin_height 6 6
# tab_bar_style custom


#######################
# Other
#######################

enabled_layouts splits
focus_follows_mouse yes
inactive_text_alpha 0.3

enable_audio_bell no
window_alert_on_bell no

macos_quit_when_last_window_closed yes
macos_show_window_title_in all
macos_show_window_title_in none
macos_colorspace displayp3


#######################
# Window
#######################

hide_window_decorations titlebar-only

background_opacity 0.85
background_blur 64

# window_margin_height 100 100
window_padding_width 8 8 0 8


#######################
# Font
#######################

font_family "JetBrainsMono Nerd Font Mono"
bold_font auto
italic_font auto
bold_italic_font auto


#######################
# Colors
#######################

color0 #000000
color1 #b23042
color2 #7fcb21
color3 #db991e
color4 #3d70f9
color5 #8e56cc
color6 #19a8db
color7 #999999
color8 #4c4c4c
color9 #842d3d
color10 #669332
color11 #a57523 
color12 #3a56a5
color13 #604c7f
color14 #197293
color15 #dbdbdb

active_border_color #2A2A2A
inactive_border_color #0A0A0A
bell_border_color #606060


#######################
# Keybinds
#######################

# Split the view into subviews in the indicated axis
map ctrl+shift+comma launch --location=hsplit
map ctrl+shift+period launch --location=vsplit

# Switch focus to the neighboring window in the indicated direction
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
