include themes/everforest_dark.conf


#######################
# Tab Bar
#######################

tab_bar_min_tabs 1
tab_bar_edge bottom
tab_bar_margin_width 8

tab_title_template "{index} ∴ {title}"
tab_title_max_length 16

tab_bar_style powerline
active_tab_font_style bold


#######################
# Other
#######################

enabled_layouts splits
focus_follows_mouse yes
inactive_text_alpha 0.3

enable_audio_bell no
window_alert_on_bell no

macos_quit_when_last_window_closed yes
macos_show_window_title_in none
macos_colorspace displayp3


#######################
# Window
#######################

hide_window_decorations titlebar-only
window_padding_width 10 10 8 10


#######################
# Font
#######################

font_size 12.0
font_family "JetBrainsMono Nerd Font Mono"
bold_font auto
italic_font auto
bold_italic_font auto


#######################
# Keybinds
#######################

# Split the view into subviews in the indicated axis
map ctrl+shift+comma launch --location=hsplit --cwd=current
map ctrl+shift+period launch --location=vsplit --cwd=current

# Switch focus to the neighboring window in the indicated direction
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down

# Rotate the neighboring views (from vertical to horizontal and vice-versa)
map ctrl+shift+enter layout_action rotate

# Shrink or grow the currently focused view
map ctrl+shift+k resize_window narrower 6
map ctrl+shift+o resize_window shorter 6
map ctrl+shift+l resize_window wider 6
map ctrl+shift+p resize_window taller 6

# Switch to the tab at the indicated index
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+0 goto_tab 10

# Search the current terminal buffer with fzf
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac
